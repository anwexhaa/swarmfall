name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Warnings are errors (Directory.Build.props), so a warning fails the build.
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Benchmark smoke run
        run: dotnet run -c Release --no-build --project bench/Swarmfall.Bench -- 500 1000
